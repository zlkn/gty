[font]
family = "JetBrains Mono"
size = 24
icon_scale = 0.75

[colors]
background = "#ebebeb"
# background = "#f2f2f2"
foreground = "#424242"
selection = "#d9d9d9"

ansi = [
  "#d1d1d1", "#b81a6b", "#1e763c", "#8d5b00",
  "#015493", "#75228e", "#007474", "#424242",
]

bright = [
  "#57606a", "#b81a6b", "#1e763c", "#8d5b00",
  "#015493", "#75228e", "#007474", "#085157",
]

[keys]
quit             = "ctrl+shift+q"
split_vertical   = "ctrl+shift+d"
split_horizontal = "ctrl+shift+e"
close_pane       = "ctrl+shift+w"
focus_next       = "ctrl+tab"
scroll_page_up   = "shift+pageup"
scroll_page_down = "shift+pagedown"
scroll_line_up   = "ctrl+shift+up"
scroll_line_down = "ctrl+shift+down"
