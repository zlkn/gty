[font]
# family = "JetBrains Mono"
# size is in points at 96 dpi, the same scale wezterm and kitty use, times the display's
# own scale: 12 rasterises at 16 px per em on a 1x panel and 32 on a 2x one.
size = 12
# false takes the frames and blocks (U+2500-259F) from the font instead of drawing them
box_drawing = false
# gamma bends the antialiasing curve; 0 derives it from the theme and from blend below.
# Anything above 1 with blend = "gamma" reads heavy — that knob existed to undo what
# linear blending does to a half-covered pixel.
gamma = 1.0

# where a glyph's edge is mixed with what is behind it. "linear" is physically right and
# drags antialiased colour towards grey; "gamma" keeps it saturated, and is what other
# terminals do.
blend = "gamma"

[window]
# false hides the system titlebar and frame, leaving the tab bar as the top of the
# window. Then only the quit binding closes it, and moving and resizing are whatever
# the window manager offers without a frame.
decorations = false

[cursor]
# block, bar or underline; a program can still change it with DECSCUSR
shape = "block"

[colors]
# light, dark, or system to follow the desktop's colour scheme (the XDG portal on Linux).
# toggle_theme switches between the two either way.
theme = "system"

[colors.light]
background = "#ebebed"
foreground = "#424242"
selection = "#d9d9d9"
cursor = "#20bbfc"

ansi = [
  "#d1d1d1", "#b81a6b", "#1e763c", "#8d5b00",
  "#015493", "#75228e", "#007474", "#54544f",
]

bright = [
  "#8e8e86", "#b81a6b", "#1e763c", "#8d5b00",
  "#015493", "#75228e", "#007474", "#1f1f1f",
]

[colors.dark]
background = "#2e2e32"
foreground = "#a1a1a1"
selection = "#45454b"
cursor = "#20bbfc"

ansi = [
  "#1a1b20", "#e06c75", "#98c379", "#e5c07b",
  "#61afef", "#c678dd", "#56b6c2", "#d9dee7",
]

bright = [
  "#7f848e", "#ef8b93", "#b3d99a", "#f0d3a0",
  "#8cc4f5", "#d79ae8", "#7fcdd7", "#ffffff",
]

[keys]
quit             = "ctrl+shift+q"
split_vertical   = "ctrl+shift+d"
split_horizontal = "ctrl+shift+e"
close_pane       = "ctrl+shift+w"
focus_next       = "alt+o"
focus_left       = "alt+h"
focus_down       = "alt+j"
focus_up         = "alt+k"
focus_right      = "alt+l"
scroll_page_up   = "shift+pageup"
scroll_page_down = "shift+pagedown"
scroll_line_up   = "ctrl+shift+up"
scroll_line_down = "ctrl+shift+down"

new_tab   = "ctrl+shift+t"
close_tab = "ctrl+shift+backspace"
next_tab  = "ctrl+tab"
prev_tab  = "ctrl+shift+tab"
copy      = "ctrl+shift+c"
paste     = "ctrl+shift+v"

toggle_theme = "ctrl+shift+l"

# goto_tab_1 through goto_tab_9 jump straight to a tab; the rest default to alt+2 … alt+9
goto_tab_1 = "alt+1"
